<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FormalEasy DRC - Créez votre entreprise en RDC</title>
    <meta
      name="description"
      content="FormalEasy DRC simplifie la création d'entreprise en République Démocratique du Congo : statuts OHADA générés par IA, dépôt GUCE, suivi temps réel et accompagnement expert."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "FormalEasy DRC",
        "url": "https://formaleasy.cd",
        "logo": "https://formaleasy.cd/logo.png",
        "sameAs": [
          "https://www.facebook.com/formaleasy",
          "https://www.linkedin.com/company/formaleasy"
        ],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Kinshasa",
          "addressCountry": "CD"
        },
        "contactPoint": [{
          "@type": "ContactPoint",
          "telephone": "+243000000000",
          "contactType": "customer service",
          "areaServed": "CD"
        }]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Quels sont les délais de création ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Dossier prêt et déposé au GUCE dès réception des pièces complètes (souvent sous 24h ouvrées). Le délai administratif du Guichet Unique est généralement de 3 à 7 jours ouvrés."
            }
          },
          {
            "@type": "Question",
            "name": "Puis-je créer ma société depuis l'étranger ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Oui, tout se fait en ligne. Signature électronique, dépôt GUCE et suivi temps réel sont inclus, spécialement pour la diaspora."
            }
          },
          {
            "@type": "Question",
            "name": "L'objet social généré est-il légal ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Oui, le moteur IA est calé sur l'OHADA et chaque objet social est relu par un formaliste avant dépôt."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
