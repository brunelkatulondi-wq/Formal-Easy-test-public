version: "3.9"

services:
  # Base de données robuste
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-formal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-formal_easy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formal -d formal_easy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache et Pub/Sub pour le temps réel
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Serveur API scalable
  server:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.server
    restart: always
    environment:
      DATABASE_URL: postgres://formal:secret@db:5432/formal_easy
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-superSecretJwtKey}
      REFRESH_SECRET: ${REFRESH_SECRET:-superRefreshJwtKey}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"

  # Frontend optimisé
  client:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata:
